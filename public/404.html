<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Megawide WMS</title>
    <script>
      // GitHub Pages has no rewrite rules, so a deep link like
      // /Warehouse-Management/inventory returns this 404 page. Encode the
      // requested path into a query string and bounce to index.html, which
      // restores it via history.replaceState before React Router boots.
      // (Technique: rafgraph/spa-github-pages)
      var pathSegmentsToKeep = 1 // the /Warehouse-Management/ repo segment
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
